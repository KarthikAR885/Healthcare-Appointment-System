<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Patient Dashboard | CarePlus
    </title>


    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>



    <!-- Navbar -->
    <nav class="navbar">

        <a href="index.html"
            class="nav-brand">

            CarePlus

        </a>



        <ul class="nav-links">


            <li>

                <button
                    id="book-btn"
                    class="btn btn-primary">

                    Book Appointment

                </button>

            </li>



            <li>

                <button
                    id="logout-btn"
                    class="btn btn-secondary">

                    Logout

                </button>

            </li>


        </ul>

    </nav>





    <!-- Dashboard -->
    <div class="dashboard-container">


        <!-- Sidebar -->
        <aside class="sidebar">

            <ul class="sidebar-nav">

                <li class="active" id="tab-appointments">
                    My Appointments
                </li>


                <li id="tab-profile">
                    Profile
                </li>

            </ul>

        </aside>





        <!-- Main Content -->
        <main class="main-content">


            <h2
                id="welcome-message">

                Welcome, Patient

            </h2>





            <div id="appointments-view">
            <!-- Appointment Table -->
            <div
                class="table-responsive">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Doctor
                            </th>

                            <th>
                                Specialty
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Time
                            </th>

                            <th>
                                Notes
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>



                    <tbody
                        id="appointments-body">

                        <tr>

                            <td colspan="7">

                                Loading appointments...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>





            </div>

            <!-- Profile View -->
            <div id="profile-view" style="display: none;">

            <!-- Medical Details -->
            <h3>
                My Medical Details
            </h3>


            <p>

                <strong>
                    Age:
                </strong>

                <span
                    id="p-age">

                </span>

            </p>



            <p>

                <strong>
                    Gender:
                </strong>

                <span
                    id="p-gender">

                </span>

            </p>



            <p>

                <strong>
                    Blood Group:
                </strong>

                <span
                    id="p-bloodGroup">

                </span>

            </p>



            <p>

                <strong>
                    Medical History:
                </strong>

                <span
                    id="p-history">

                </span>

            </p>





            <hr>





            <!-- Prescription -->
            <h3>
                Doctor Prescription
            </h3>


            <p
                id="p-notes">

                Loading...

            </p>





            <button
                onclick="window.location.href='profile.html'"
                class="btn btn-secondary">

                Edit Patient Details

            </button>

            <br>

            <br>



            <button
                onclick="window.location.href='prescription.html'"
                class="btn btn-secondary">

                View Prescriptions

            </button>

            <br>

            <br>



            <button
                onclick="downloadPrescription()"
                class="btn btn-primary">

                Save Prescription PDF

            </button>

            </div>

        </main>

    </div>




    <script src="js/patient-dashboard.js?v=3"></script>

    <script src="js/back.js?v=1"></script>
</body>

</html>
