<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Doctor Dashboard
    </title>


    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>



    <!-- Navbar -->
    <nav class="navbar">

        <a href="#"
            class="nav-brand">

            CarePlus Doctor

        </a>



        <button
            class="btn btn-secondary"
            id="logout-btn">

            Logout

        </button>

    </nav>





    <!-- Main -->
    <section class="section">


        <h2>
            Doctor Dashboard
        </h2>

        <!-- Doctor Profile -->
        <div class="doctor-profile-panel">

            <h3>
                My Profile
            </h3>

            <div
                id="doctor-profile-alert"
                class="alert">
            </div>

            <form id="doctor-profile-form">

                <div class="profile-form-grid">

                    <div class="form-group">
                        <label for="doctorName">
                            Doctor Name
                        </label>
                        <input
                            type="text"
                            id="doctorName"
                            class="form-control"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="specialization">
                            Specialization
                        </label>
                        <input
                            type="text"
                            id="specialization"
                            class="form-control"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="experience">
                            Experience
                        </label>
                        <input
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            id="experience"
                            class="form-control"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="availableStatus">
                            Availability
                        </label>
                        <select
                            id="availableStatus"
                            class="form-control"
                            required>
                            <option value="true">
                                Available
                            </option>
                            <option value="false">
                                Not Available
                            </option>
                        </select>
                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save Profile
                </button>

            </form>

        </div>



        <!-- Appointments -->
        <h3>
            My Appointments
        </h3>

        <div
            class="table-responsive">

            <table
                id="doctor-table">


                <thead>

                    <tr>

                        <th>
                            Patient
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Time
                        </th>

                        <th>
                            Notes
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>



                <tbody
                    id="doctor-body">

                </tbody>


            </table>

        </div>


    </section>




    <script src="js/doctor-dashboard.js?v=3"></script>

    <script src="js/back.js?v=1"></script>
</body>

</html>
