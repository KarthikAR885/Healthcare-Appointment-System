<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | CarePlus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            CarePlus
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="patient-dashboard.html" class="btn btn-secondary">Dashboard</a></li>
            <li><a href="#" class="btn btn-primary" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 600px;">
            <h2>Book an Appointment</h2>
            <div id="booking-alert" class="alert"></div>
            
            <form id="appointment-form">
                <div class="form-group">
                    <label for="doctorSelect">Select Doctor</label>
                    <select id="doctorSelect" class="form-control" required>
                        <option value="">-- Choose a Doctor --</option>
                        <!-- Options injected via JS -->
                    </select>
                </div>
                
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="appointmentDate">Date</label>
                        <input type="date" id="appointmentDate" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="appointmentTime">Time</label>
                        <input type="time" id="appointmentTime" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="notes">Notes / Symptoms</label>
                    <textarea id="notes" class="form-control" rows="4" placeholder="Briefly describe your symptoms or reason for visit..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script src="js/appointment.js?v=2"></script>
    <script src="js/back.js?v=1"></script>
</body>
</html>
