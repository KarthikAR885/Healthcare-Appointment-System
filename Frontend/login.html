<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarePlus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            CarePlus
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="login.html" class="btn btn-secondary">Login</a></li>
            <li><a href="register.html" class="btn btn-primary">Register</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <div id="login-alert" class="alert"></div>
            
            <form id="login-form">
                <div class="form-group">

    <label>
        Login As
    </label>

    <select
        id="role"
        class="form-control"
        required>

        <option value="">
            Select Role
        </option>

        <option value="PATIENT">
            Patient
        </option>

        <option value="ADMIN">
            Admin
        </option>

        <option value="DOCTOR">
            Doctor
        </option>

    </select>

</div>
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input type="text" id="email" class="form-control" required placeholder="john@example.com or admin">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>

        </div>
    </div>

    <script src="js/login.js?v=5"></script>
    <script src="js/back.js?v=1"></script>
</body>
</html>
