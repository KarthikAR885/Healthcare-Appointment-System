<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Patient Profile
    </title>


    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>



    <nav class="navbar">

        <a href="patient-dashboard.html"
            class="nav-brand">

            CarePlus

        </a>

    </nav>





    <div class="auth-container">

        <div class="auth-card">


            <h2>
                Patient Profile
            </h2>




            <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                id="age"
                placeholder="Age"
                class="form-control">

            <br>





            <input
                type="text"
                id="gender"
                placeholder="Gender"
                class="form-control">

            <br>





            <input
                type="text"
                id="bloodGroup"
                placeholder="Blood Group"
                class="form-control">

            <br>





            <textarea
                id="medicalHistory"
                placeholder="Medical History"
                class="form-control">

            </textarea>

            <br>





            <button
                id="save-profile-btn"
                class="btn btn-primary">

                Save Profile

            </button>


        </div>

    </div>




    <script src="js/profile.js?v=2"></script>

    <script src="js/back.js?v=1"></script>
</body>

</html>
